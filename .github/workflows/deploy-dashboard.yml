name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'evidence_dashboard/package-lock.json'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          export_environment_variables: true

      - name: Install Dependencies
        run: |
          cd evidence_dashboard
          npm install

      - name: Build Dashboard
        run: |
          cd evidence_dashboard
          npm run build
        env:
          EVIDENCE_DB_TYPE: bigquery
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          EVIDENCE_BQ_DATASET: dbt_prod
          BASE_PATH: /public.dlt-pipeline-orchestration # Deploys to subpath on Github Pages
