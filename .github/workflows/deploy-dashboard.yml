name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'evidence_dashboard/**'
      - 'deploy/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'evidence_dashboard/package-lock.json'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          export_environment_variables: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Backend Health Check
        run: |
          echo "=== Verifying AI Backend Proxy Health ==="
          BACKEND_URL=$(grep -oE "https://[^']+" evidence_dashboard/components/CockpitDiagnosticAiCard.svelte | head -n 1 || echo "")
          if [ -z "$BACKEND_URL" ]; then
            echo "❌ Error: Backend URL not found in CockpitDiagnosticAiCard.svelte"
            exit 1
          fi

          BASE_URL=$(echo "$BACKEND_URL" | sed 's|/chat$||')
          HEALTH_URL="${BASE_URL}/health"
          echo "Target Health Endpoint: ${HEALTH_URL}"

          HEALTH_SUCCESS=false
          for i in {1..6}; do
            echo "Health check attempt $i/6, polling every 5s..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              HEALTH_SUCCESS=true
              echo "✓ Backend health verified (HTTP 200 OK)."
              break
            fi
            echo "Attempt $i returned HTTP $HTTP_CODE. Waiting 5s for cold start..."
            sleep 5
          done

          if [ "$HEALTH_SUCCESS" = false ]; then
            echo "::error file=evidence_dashboard/components/CockpitDiagnosticAiCard.svelte::Backend health check failed at ${HEALTH_URL}. Cloud Function is unreachable or returning non-200."
            exit 1
          fi

      - name: Install Dependencies
        run: |
          cd evidence_dashboard
          npm install

      - name: Build Dashboard
        run: |
          mkdir -p evidence_dashboard/sources/analytics
          printf "name: analytics\ntype: bigquery\noptions:\n  authenticator: gcloud-cli\n  project_id: gcp-etl-497002\n  dataset: dbt_prod\n" > evidence_dashboard/sources/analytics/connection.yaml
          cd evidence_dashboard
          printf "\ndeployment:\n  basePath: /${{ github.event.repository.name }}\n" >> evidence.config.yaml
          npm run sources
          npm run build
          if [ ! -f "build/overview/index.html" ]; then
            echo "❌ FATAL: build/overview/index.html was not generated. Prerender failed!"
            exit 1
          fi

      - name: Create .nojekyll file
        run: touch evidence_dashboard/build/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: evidence_dashboard/build
          branch: gh-pages
