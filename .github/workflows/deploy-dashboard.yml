name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'evidence_dashboard/**'
      - 'deploy/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'evidence_dashboard/package-lock.json'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          export_environment_variables: true

      - name: Verify Backend Health Check
        run: |
          echo "=== Verifying AI Backend Proxy Health ==="
          BACKEND_URL=$(grep -oE "https://[^']+" evidence_dashboard/components/CockpitDiagnosticAiCard.svelte | head -n 1 || echo "")
          if [ -n "$BACKEND_URL" ]; then
            BASE_URL=$(echo "$BACKEND_URL" | sed 's|/chat$||')
            echo "Pinging ${BASE_URL}/health..."
            curl -f -s --max-time 10 "${BASE_URL}/health" || echo "⚠️ Warning: Backend health check timed out or unreachable. Dashboard will fall back to preset caches."
          fi

      - name: Install Dependencies
        run: |
          cd evidence_dashboard
          npm install

      - name: Build Dashboard
        run: |
          mkdir -p evidence_dashboard/sources/analytics
          printf "name: analytics\ntype: bigquery\noptions:\n  authenticator: gcloud-cli\n  project_id: gcp-etl-497002\n  dataset: dbt_prod\n" > evidence_dashboard/sources/analytics/connection.yaml
          cd evidence_dashboard
          printf "\ndeployment:\n  basePath: /${{ github.event.repository.name }}\n" >> evidence.config.yaml
          npm run sources
          npm run build
          if [ ! -f "build/overview/index.html" ]; then
            echo "❌ FATAL: build/overview/index.html was not generated. Prerender failed!"
            exit 1
          fi

      - name: Create .nojekyll file
        run: touch evidence_dashboard/build/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: evidence_dashboard/build
          branch: gh-pages
