[project]
name = "dlt-pipeline"
version = "0.1.0"
description = "DLT Pipeline"
authors = [
    {name = "Thông Phạm", email = "phamthong99@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "dlt (>=1.25.0,<2.0.0)",
    "dlt[postgres] (>=1.25.0,<2.0.0)",
    "dlt[bigquery] (>=1.25.0,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "dbt-core (>=1.8.0,<2.0.0)",
    "dbt-postgres (>=1.8.0,<2.0.0)",
    "dbt-bigquery (>=1.8.0,<2.0.0)",
    "google-cloud-secret-manager (>=2.20.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
