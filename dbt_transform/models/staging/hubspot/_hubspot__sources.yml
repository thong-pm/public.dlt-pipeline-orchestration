version: 2

sources:
  - name: hubspot
    description: "Raw HubSpot CRM data loaded by dlt."
    schema: "{{ 'hubspot_raw' if target.name == 'prod' else 'hubspot_data' }}"
    tables:
      - name: contacts
        description: "HubSpot contact records."
      - name: companies
        description: "HubSpot company records."
      - name: deals
        description: "HubSpot deal pipeline records."
      - name: owners
        description: "HubSpot deal owners."
