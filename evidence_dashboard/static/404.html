<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Executive Cockpit Redirect</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect fallback script
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // Only redirect if path does not end with '/' and has no file extension
        if (path && !path.endsWith('/') && !path.includes('.')) {
          window.location.replace(path + '/' + search + hash);
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
