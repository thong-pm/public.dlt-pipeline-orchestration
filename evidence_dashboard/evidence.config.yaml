appearance:
  default: light
  switcher: true

theme:
  colorPalettes:
    default:
      light:
        - "#0d9488"
        - "#f59e0b"
        - "#2dd4bf"
        - "#f87171"
        - "#94a3b8"
        - "#fbbf24"
        - "#64748b"
      dark:
        - "#0d9488"
        - "#f59e0b"
        - "#2dd4bf"
        - "#f87171"
        - "#94a3b8"
        - "#fbbf24"
        - "#64748b"
  colorScales:
    default:
      light:
        - "#ccfbf1"
        - "#0f766e"
      dark:
        - "#134e4a"
        - "#2dd4bf"
  colors:
    primary:
      light: "#0d9488"
      dark: "#14b8a6"
    accent:
      light: "#264773"
      dark: "#3b6998"
    base:
      light: "#ffffff"
      dark: "#05070b"
    info:
      light: "#64748b"
      dark: "#94a3b8"
    positive:
      light: "#0d9488"
      dark: "#10b981"
    warning:
      light: "#b45309"
      dark: "#f59e0b"
    negative:
      light: "#ef4444"
      dark: "#f87171"

plugins:
  components:
    # This loads all of evidence's core charts and UI components
    # You probably don't want to edit this dependency unless you know what you are doing
    "@evidence-dev/core-components": {}

  datasources:
    "@evidence-dev/bigquery": { }
    "@evidence-dev/duckdb": { }
    "@evidence-dev/postgres": { }

